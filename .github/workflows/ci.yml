name: CI

on:
  push:
  pull_request:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate profile README
        run: |
          test -f README.md
          grep -qE '^# .*s0u7a' README.md
          echo "--- https links ---"
          grep -o 'https://[^") ]*' README.md | sed 's/&amp;/\&/g' | sort -u | tee links.txt
          test -s links.txt
      - name: Check links are reachable
        run: |
          fail=0
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -L -A "$ua" "$url") || code="000"
            case "$code" in
              2*|3*) ;;
              *)
                sleep 3
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -L -A "$ua" "$url") || code="000"
                ;;
            esac
            echo "$code $url"
            case "$code" in 2*|3*) ;; *) echo "dead link: $url ($code)"; fail=1;; esac
          done < links.txt
          exit $fail
