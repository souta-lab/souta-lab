name: CI

on:
  push:
  pull_request:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate profile README
        run: |
          test -f README.md
          grep -q '^# souta-lab' README.md
          echo "--- https links ---"
          grep -o 'https://[^) ]*' README.md | sort -u | tee links.txt
          test -s links.txt
      - name: Check links are reachable
        run: |
          fail=0
          while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -L "$url") || code="000"
            echo "$code $url"
            case "$code" in 2*|3*) ;; *) echo "dead link: $url ($code)"; fail=1;; esac
          done < links.txt
          exit $fail
