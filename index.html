.drawer{position:fixed;inset:0;z-index:80;pointer-events:none}.drawer[aria-hidden="false"]{pointer-events:auto}.drawer__scrim{position:absolute;inset:0;border:0;background:rgba(0,0,0,.38);opacity:0;transition:.2s}.drawer__panel{position:absolute;right:0;top:0;bottom:0;width:min(1020px,100vw);background:#faf8f3;transform:translateX(100%);transition:.25s;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.18)}.drawer[aria-hidden="false"] .drawer__scrim{opacity:1}.drawer[aria-hidden="false"] .drawer__panel{transform:none}.drawer__head{position:sticky;top:0;z-index:2;background:#faf8f3;border-bottom:1px solid #ccc6bb;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.drawer__head span{display:block;font-size:12px;color:var(--mut)}.sheet{font-family:var(--serif);background:#fff;width:calc(100% - 24px);margin:12px;border:1px solid #aaa;padding:22px}.sheet h3{text-align:center;letter-spacing:.14em;margin:0 0 15px}.sheet-grid{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:12px}.sheet-grid th,.sheet-grid td{border:1px solid #777;padding:5px;text-align:center}.sheet-grid th{background:#f0efeb}.sheet-grid select,.sheet-grid input{width:100%;min-width:48px;border:1px solid #999;background:#fff;padding:5px 4px;text-align:center;border-radius:4px}.sheet-score{font-weight:800}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions button{flex:1}

<script>'use strict';
const KANA=['ア','イ','ウ','エ','オ','カ','キ','ク','ケ','コ','サ','シ','ス','セ','ソ','タ','チ','ツ','テ','ト','ナ','ニ','ヌ','ネ','ノ'];
const SEC_POINTS={1:2,2:2,3:2,4:3,5:3,6:3,7:5};
const EXAM_NAMES=['第1回','第2回','第3回','第4回','第5回','第6回','第7回','第8回','第9回','第10回'];
const deepClone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seeded(seed){let x=(seed*2654435761)>>>0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function shuffle(a,seed){const r=seeded(seed),b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function choiceBank(options,seed){
  const mixed=shuffle(options,seed); const map={}; mixed.forEach((o,i)=>map[o.id]=KANA[i]);
  return {mixed,map,html:`<div class="answer-group"><h4>＜解答群＞</h4><div class="answer-group-grid">${mixed.map((o,i)=>`<div>${KANA[i]}．${o.text}</div>`).join('')}</div></div>`};
}
function item(sec,no,answer,explanation,topic,opt={}){return {sec,no:String(no),answer:Array.isArray(answer)?answer.map(String):[String(answer)],explanation,topic,page:opt.page||null,kind:opt.kind||'select',choices:opt.choices||KANA.slice(0,15),orderSensitive:opt.orderSensitive!==false,label:opt.label||null}}
function blank(n,wide=false){return `<span class="blank${wide?' wide':''}">(${n})</span>`}
function pageShell(examNo,pageNo,content,cls=''){
  return `<article class="paper ${cls}" data-page="${pageNo}"><div class="paper-head">模試 ${String(examNo).padStart(2,'0')}　1－${['❶','❷','❸','❹','❺','❻','❼','❽','❾','❿'][pageNo-1]}</div>${content}<div class="paper-page">－ ${pageNo} －</div></article>`;
}
function coverShell(examNo){return `<article class="paper cover-paper"><div class="cover-top"><span>無断転載禁止</span><span>プログラミング1級</span></div><div class="cover-title"><div class="year">本番形式模擬試験　第${examNo}回</div><h2>情報処理検定試験</h2><h3>〈プログラミング〉</h3><div style="font-size:24px;font-weight:700">第１級　試験問題</div><div class="notice"><b>注意事項</b><ol><li>試験開始の合図があるまで問題を見ない想定で利用してください。</li><li>問題は10ページあります。</li><li>解答はすべて解答用紙に記入してください。</li><li>電卓などの計算用具を使わずに解く想定です。</li><li>制限時間は60分です。</li></ol></div></div><div><div class="org">非公式・学習用オリジナル模試</div><div class="candidate">受験番号</div></div></article>`}
function arrayTable(headers,rows){return `<table class="array-grid"><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`}
function fieldLayout(fields){return `<div class="data-layout">${fields.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`}
function outputBox(text){return `<div class="output-box">${esc(text)}</div>`}

const TERM_POOL=[
 {t:'スループット',d:'単位時間当たりに処理できる仕事量を表す。',cat:'システム'},
 {t:'ターンアラウンドタイム',d:'処理を依頼してから、結果をすべて受け取るまでの時間。',cat:'システム'},
 {t:'レスポンスタイム',d:'処理を要求してから、最初の応答が返るまでの時間。',cat:'システム'},

 {t:'二分探索法',d:'昇順または降順に整列済みのデータの探索範囲を半分ずつ狭める方法。',cat:'アルゴリズム'},
 {t:'選択法',d:'未整列部分から最小値や最大値を選択し、所定位置へ移す整列法。',cat:'アルゴリズム'},

 {t:'ボトムアップテスト',d:'下位モジュールから結合していき、上位モジュールの呼出しを代用品で補うテスト。',cat:'テスト'},
 {t:'スタブ',d:'トップダウンテストで、未完成の下位モジュールの代わりに使うもの。',cat:'テスト'},
 {t:'ドライバ',d:'ボトムアップテストで、未完成の上位モジュールの代わりに呼出しを行うもの。',cat:'テスト'},
 {t:'カプセル化',d:'データとその操作を一体化し、内部実装を外部から隠す考え方。',cat:'OOP'},

 {t:'オーバーフロー',d:'演算結果の絶対値が、表現可能な範囲を超えることで生じる。',cat:'数値'},
 {t:'桁落ち',d:'ほぼ等しい数値同士の減算で有効数字が大きく失われる現象。',cat:'数値'},
 {t:'丸め誤差',d:'有限桁で表現するために四捨五入や切捨てを行うことで生じる誤差。',cat:'数値'},
 {t:'情報落ち',d:'絶対値が大きく異なる浮動小数点数の加減算で小さい側の有効数字が失われる現象。',cat:'数値'},
 {t:'プロトコル',d:'ネットワーク上で通信するときの手順や形式などの取り決め。',cat:'ネットワーク'},

 {t:'公開鍵暗号方式',d:'暗号化と復号で異なる鍵を使い、一方の鍵を公開できる暗号方式。',cat:'セキュリティ'},
 {t:'ディジタル署名',d:'公開鍵暗号の仕組みなどを利用して、改ざん検出や送信者確認を行う。',cat:'セキュリティ'},
 {t:'排他制御',d:'複数の処理が同じ共有資源を同時更新して矛盾することを防ぐ制御。',cat:'OS'},
 {t:'デッドロック',d:'複数の処理が互いに必要な資源の解放を待ち続け、進行できなくなる状態。',cat:'OS'},
 {t:'仮想記憶',d:'補助記憶装置の一部を利用し、主記憶より大きいアドレス空間を扱う方式。',cat:'OS'},
 {t:'正規化',d:'データベースで重複や更新時の不整合を減らすため、表を適切に分割すること。',cat:'DB'},
 {t:'主キー',d:'表の各行を一意に識別するための属性または属性の組。',cat:'DB'}
];
function buildQ1Q2(seed){
  const selected=shuffle(TERM_POOL,seed*17+3).slice(0,12);
  const q1Targets=shuffle(selected,seed*29+5).slice(0,5);
  const q1Items=q1Targets.map((x,i)=>item(1,i+1,KANA[selected.indexOf(x)],`${x.t}：${x.d}`,x.cat,{page:1,choices:KANA.slice(0,12)}));
  const q1=`<div class="qblock"><div class="qtitle"><span class="num">【1】</span>次の説明文に最も適した答えを解答群から選び、記号で答えなさい。</div><div class="definition-list">${q1Targets.map((x,i)=>`<div class="definition"><b>${i+1}</b><div>${esc(x.d)}</div></div>`).join('')}</div><div class="term-list">${selected.map((x,i)=>`<div>${KANA[i]}．${esc(x.t)}</div>`).join('')}</div></div>`;

  const base=shuffle(TERM_POOL.filter(x=>!q1Targets.includes(x)),seed*19+9).slice(0,10);
  const a=base.slice(0,5), b=shuffle(base.map(x=>({target:x,txt:x.d})),seed*23+1);
  const q2Items=a.map((x,i)=>item(2,i+1,KANA[b.findIndex(y=>y.target===x)],`${x.t} は「${x.d}」に対応する。`,x.cat,{page:1,choices:KANA.slice(0,10)}));
  const q2=`<div class="qblock"><div class="qtitle"><span class="num">【2】</span>次のA群の語句に最も関係の深い説明文をB群から選び、記号で答えなさい。</div><div class="ab-grid"><div class="ab-box"><h4>＜A群＞</h4><ol>${a.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ol></div><div class="ab-box"><h4>＜B群＞</h4><div class="bgroup">${b.map((x,i)=>`<div><b>${KANA[i]}．</b><span>${esc(x.txt)}</span></div>`).join('')}</div></div></div></div>`;
  return {html:q1+q2,items:[...q1Items,...q2Items]};
}
function bin8(n){return (n&255).toString(2).padStart(8,'0')}
function q3Templates(seed){
 const k=seed%10,n=seed+2;
 const cases=[];
 cases.push({stem:`10進数 ${37+n} を8ビットの2進数で表したものはどれか。`,choices:[bin8(37+n),bin8(38+n),bin8(36+n)],ans:0,exp:`${37+n} を2進数へ変換すると ${bin8(37+n)}。`,topic:'数値表現'});
 const v=0b10110110; cases.push({stem:`8ビットの値 ${bin8(v)} を論理右シフトで2ビット移動した結果はどれか。`,choices:[bin8(v>>2),bin8((v<<2)&255),bin8(v>>1)],ans:0,exp:`論理右シフトでは左を0で埋めるので ${bin8(v>>2)}。`,topic:'シフト'});
 cases.push({stem:'クラスから生成した具体的な実体を表す用語はどれか。',choices:['インスタンス','メソッド','スーパークラス'],ans:0,exp:'クラスを設計図としたとき、そこから生成された実体がインスタンス。',topic:'OOP'});
 cases.push({stem:'トップダウンテストで、未完成の下位モジュールの代わりに使うものはどれか。',choices:['スタブ','ドライバ','デバッガ'],ans:0,exp:'トップダウンでは下位モジュールの代用品としてスタブを使う。',topic:'テスト'});
 cases.push({stem:'整列済みデータに対し、探索範囲を半分ずつ狭める探索法はどれか。',choices:['二分探索法','線形探索法','ハッシュ法'],ans:0,exp:'中央値との比較によって探索範囲を半分にするのが二分探索法。',topic:'探索'});
 cases.push({stem:'同じ資源を複数処理が同時に更新しないようにする制御はどれか。',choices:['排他制御','再配置','スプーリング'],ans:0,exp:'共有資源への同時アクセスによる矛盾を防ぐのが排他制御。',topic:'OS'});
 cases.push({stem:'ほぼ等しい二つの浮動小数点数を減算し、有効数字が失われる現象はどれか。',choices:['桁落ち','情報落ち','オーバーフロー'],ans:0,exp:'近い数同士の減算で有効数字が急減するのが桁落ち。',topic:'数値表現'});
 cases.push({stem:'異なるネットワーク間で、宛先に応じてパケットを中継する機器はどれか。',choices:['ルータ','リピータ','ハブ'],ans:0,exp:'IPアドレスなどに基づいてネットワーク間を中継するのがルータ。',topic:'ネットワーク'});
 cases.push({stem:'未整列部分から最小値を一つ選び、先頭側の所定位置へ移す整列法はどれか。',choices:['選択法','交換法','挿入法'],ans:0,exp:'未整列部分の最小（最大）要素を選ぶ手順が選択法。',topic:'整列'});
 cases.push({stem:'表の一つの行を一意に識別するために設定する属性はどれか。',choices:['主キー','外部キー','インデックス'],ans:0,exp:'各行を一意に識別する属性が主キー。',topic:'DB'});
 return cases[(k+seed)%cases.length];
}
function buildQ3(seed){
  const chosen=[]; for(let i=0;i<4;i++) chosen.push(q3Templates(seed*5+i*3));
  const items=[]; let html=`<div class="qblock"><div class="qtitle"><span class="num">【3】</span>次の問いに答えなさい。</div><div class="instruction">1～4については、各問のア～ウから最も適するものを一つ選び、5は数値を答えなさい。</div>`;
  chosen.forEach((q,i)=>{
    const pairs=q.choices.map((x,j)=>({x,j})); const mix=shuffle(pairs,seed*31+i); const ans=KANA[mix.findIndex(p=>p.j===q.ans)];
    html+=`<div class="mcq"><div class="stem"><b>${i+1}</b>　${esc(q.stem)}</div><div class="choices">${mix.map((p,j)=>`<div class="choice">${KANA[j]}．${esc(p.x)}</div>`).join('')}</div></div>`;
    items.push(item(3,i+1,ans,q.exp,q.topic,{page:2,choices:KANA.slice(0,3)}));
  });
  const mtbf=80+seed*10,mttr=4+(seed%3), availability=mtbf/(mtbf+mttr); const pct=Math.floor(availability*1000)/10;
  html+=`<div class="mcq"><div class="stem"><b>5</b>　MTBFが ${mtbf} 時間、MTTRが ${mttr} 時間であるシステムの稼働率を百分率で求め、小数第2位を切り捨てて小数第1位まで答えなさい。</div></div></div>`;
  items.push(item(3,5,String(pct),`稼働率＝MTBF÷(MTBF＋MTTR)＝${mtbf}÷${mtbf+mttr}。百分率では ${pct}%（指定どおり小数第1位まで）。`,'信頼性',{page:2,kind:'number',choices:[]}));
  return {html,items};
}

function algoInsertion(seed,startNo=1){

function algoSelection(seed,startNo=1){
 const vals=['kiwi','apple','pear','melon','grape'];
 const opts=[

function algoBubble(seed,startNo=1){

  {id:'BADCOND',text:'D(j) < D(j + 1)'},{id:'BADPUT',text:'D(j) = D(0)'},{id:'LOOP',text:'j = 1 To n - i'}];

 const code=`Sub Program${startNo===1?'1':'2'}(D() As Long, n As Long)\n    Dim i As Long\n    Dim j As Long\n    For i = 1 To n - 1\n        For j = 1 To n - i\n            If ${blank(n1)} Then\n                D(0) = D(j)\n                D(j) = D(j + 1)\n                ${blank(n2)}\n            End If\n        Next j\n    Next i\n    For i = 1 To n\n        MsgBox (D(i))\n    Next i\nEnd Sub`;

 return {html,count:2,title:'交換法',items:[
  item(4,n1,bank.map.COND,'昇順なので左要素が右要素より大きい場合に交換する。','交換法',{choices:KANA.slice(0,opts.length)}),
  item(4,n2,bank.map.PUT,'D(j) を0番地へ退避済みなので、交換の最後は D(j+1)=D(0)。','交換法',{choices:KANA.slice(0,opts.length)})]};
}
function algoRank(seed,startNo=1){
 const opts=[
  {id:'CMP',text:'Score(i) < Score(k)'},{id:'UP',text:'Jun(i) = Jun(i) + 1'},
  {id:'BADCMP',text:'Score(i) <= Score(k)'},{id:'BADUP',text:'Jun(k) = Jun(k) + 1'},{id:'EQ',text:'Score(i) = Score(k)'}];
 const bank=choiceBank(opts,seed*109+17),n1=startNo,n2=startNo+1;
 const code=`Sub Program${startNo===1?'1':'2'}(Score() As Long, Jun() As Long, n As Long)\n    Dim g As Long\n    Dim i As Long\n    Dim k As Long\n    For g = 1 To n\n        Jun(g) = 1\n    Next g\n    For i = 1 To n - 1\n        For k = i + 1 To n\n            If ${blank(n1)} Then\n                ${blank(n2)}\n            ElseIf Score(i) > Score(k) Then\n                Jun(k) = Jun(k) + 1\n            End If\n        Next k\n    Next i\n    For g = 1 To n\n        MsgBox (Score(g) & " " & Jun(g) & "位")\n    Next g\nEnd Sub`;
 const html=`<div class="qtitle"><span class="num">【4】</span>次の各問いに答えなさい。</div><div class="subhead">問${startNo===1?'1':'2'}．次のプログラムは、配列 Score の値を大きい順に順位付けするものである。</div><div class="subhead">処理条件</div><ol class="spec-list"><li>Score(1)～Score(n) に得点が記憶されている。</li><li>Jun の全要素を1で初期化し、自分より大きい得点一つにつき順位を1増やす。</li><li>同点は同順位とする。</li></ol><div class="program">${code}</div>${bank.html}`;
 return {html,count:2,title:'順位付け',items:[
  item(4,n1,bank.map.CMP,'Score(i) より大きい得点が存在するときだけ Jun(i) を増やすので Score(i)<Score(k)。','順位付け',{choices:KANA.slice(0,opts.length)}),
  item(4,n2,bank.map.UP,'順位を求めている対象は i なので Jun(i) を1増やす。','順位付け',{choices:KANA.slice(0,opts.length)})]};
}
function algoBinary(seed,startNo=1,recursive=false){
 const n1=startNo,n2=startNo+1,n3=startNo+2;
 if(recursive){
  const opts=[
   {id:'EMPTY',text:'left > right'},{id:'LEFT',text:'Search(D(), key, left, mid - 1)'},{id:'RIGHT',text:'Search(D(), key, mid + 1, right)'},
   {id:'BAD1',text:'left < right'},{id:'BAD2',text:'Search(D(), key, left, mid + 1)'},{id:'BAD3',text:'Search(D(), key, mid - 1, right)'}];
  const bank=choiceBank(opts,seed*113+19);
  const code=`Function Search(D() As Long, key As Long, left As Long, right As Long) As Long\n    Dim mid As Long\n    If ${blank(n1)} Then\n        Search = -1\n    Else\n        mid = (left + right) \\ 2\n        If D(mid) = key Then\n            Search = mid\n        ElseIf key < D(mid) Then\n            Search = ${blank(n2)}\n        Else\n            Search = ${blank(n3)}\n        End If\n    End If\nEnd Function`;
  const html=`<div class="qtitle"><span class="num">【4】</span>次の各問いに答えなさい。</div><div class="subhead">問${startNo===1?'1':'2'}．昇順の配列 D を再帰処理によって二分探索する関数である。</div><div class="subhead">処理条件</div><ol class="spec-list"><li>見つかった場合は添字を、見つからない場合は -1 を返す。</li><li>「\\」は整数除算を表す。</li></ol>${arrayTable(['添字','1','2','3','4','5','6','7'],[['D',12,21,35,48,57,73,86]])}<div class="program">${code}</div>${bank.html}`;
  return {html,count:3,title:'再帰二分探索',items:[
   item(4,n1,bank.map.EMPTY,'left>right なら探索範囲が空なので -1 を返す。','二分探索',{choices:KANA.slice(0,opts.length)}),
   item(4,n2,bank.map.LEFT,'key が中央値より小さいので左半分 left～mid-1 を再帰探索する。','二分探索',{choices:KANA.slice(0,opts.length)}),
   item(4,n3,bank.map.RIGHT,'key が中央値より大きいので右半分 mid+1～right を再帰探索する。','二分探索',{choices:KANA.slice(0,opts.length)})]};
 }
 const opts=[
  {id:'LOOP',text:'low <= high And pos = -1'},{id:'LEFT',text:'high = mid - 1'},
  {id:'BADLOOP',text:'low > high And pos = -1'},{id:'BADLEFT',text:'high = mid + 1'},{id:'RIGHT',text:'low = mid + 1'}];
 const bank=choiceBank(opts,seed*127+23);
 const code=`Sub Program${startNo===1?'1':'2'}(D() As Long, n As Long, key As Long)\n    Dim low As Long\n    Dim high As Long\n    Dim mid As Long\n    Dim pos As Long\n    low = 1\n    high = n\n    pos = -1\n    Do While ${blank(n1)}\n        mid = (low + high) \\ 2\n        If D(mid) = key Then\n            pos = mid\n        ElseIf D(mid) < key Then\n            low = mid + 1\n        Else\n            ${blank(n2)}\n        End If\n    Loop\n    MsgBox (pos)\nEnd Sub`;
 const html=`<div class="qtitle"><span class="num">【4】</span>次の各問いに答えなさい。</div><div class="subhead">問${startNo===1?'1':'2'}．昇順に整列済みの配列 D から key を二分探索するプログラムである。</div><div class="subhead">処理条件</div><ol class="spec-list"><li>見つかった添字を pos に記憶し、存在しないときは -1 を表示する。</li><li>「\\」は整数除算を表す。</li></ol>${arrayTable(['添字','1','2','3','4','5','6','7','8'],[['D',9,17,28,34,46,55,72,90]])}<div class="program">${code}</div>${bank.html}`;
 return {html,count:2,title:'二分探索',items:[
  item(4,n1,bank.map.LOOP,'探索範囲が残り、まだ見つかっていない間だけ反復する。','二分探索',{choices:KANA.slice(0,opts.length)}),
  item(4,n2,bank.map.LEFT,'D(mid)>key の場合は右端を mid-1 にする。','二分探索',{choices:KANA.slice(0,opts.length)})]};
}
function buildQ4(seed){

 const [a,b]=combos[(seed-1)%combos.length];
 const fn=(name,s,no)=>({ins:algoInsertion,sel:algoSelection,bubble:algoBubble,rank:algoRank,bin:(x,y)=>algoBinary(x,y,false)})[name](s,no);
 const p1=fn(a,seed,1), p2=fn(b,seed+21,p1.count+1);
 if(p1.count+p2.count!==5) throw new Error('Q4 blank count must be 5');
 p1.items.forEach(x=>x.page=3); p2.items.forEach(x=>x.page=4);
 return {p1,p2,items:[...p1.items,...p2.items]};
}

 if(!STATE.exam)return; const e=STATE.exam,p=getProgress(e.n),wrap=$('#answerSheet'); $('#drawerExamTitle').textContent=e.title;
 const secItems=s=>e.items.filter(x=>x.sec===s);
 const inputCell=(it)=>{const cur=p.answers[ansKey(it)]||[];if(it.answer.length===1)return `<div class="ans">${renderInput(it,0,cur[0]||'')}</div>`;return `<div class="ans double">${it.answer.map((_,i)=>renderInput(it,i,cur[i]||'')).join('')}</div>`};
 const row=s=>{const xs=secItems(s);return `<tr><th class="sec">【${s}】</th>${xs.map(it=>`<td><div class="no">${it.no}</div>${inputCell(it)}</td>`).join('')}<td class="scorebox"><span>小計</span><b>${xs.length*SEC_POINTS[s]}</b></td></tr>`};
 wrap.innerHTML=`<div class="sheet"><div class="sheet-headline">非公式　本番形式模試 ${e.n}　プログラミング 第1級</div><div class="sheet-subtitle">解答用紙</div><div class="sheet-scroll"><table class="official-sheet"><tbody>${[1,2,3,4,5,6,7].map(row).join('')}</tbody></table></div><div class="sheet-note">複数解答欄は、その設問のすべての欄が正しいときに得点。⑦の一部は順不同。</div><div class="sheet-actions"><button class="ghost" type="button" onclick="closeSheet()">問題へ戻る</button><button class="primary" type="button" onclick="submitExam()">採点する</button></div><div class="fine" style="margin-top:8px">入力内容はこの端末のブラウザに自動保存されます。</div></div>`;
 wrap.querySelectorAll('select,input').forEach(x=>x.addEventListener('change',saveAnswer));wrap.querySelectorAll('input').forEach(x=>x.addEventListener('input',saveAnswer));
}
function saveAnswer(ev){const e=STATE.exam,p=getProgress(e.n),el=ev.target,k=el.dataset.key,idx=Number(el.dataset.idx),v=el.value.trim();p.answers[k]=p.answers[k]||[];p.answers[k][idx]=v;setProgress(e.n,p);document.querySelectorAll(`[data-key="${k}"][data-idx="${idx}"]`).forEach(x=>{if(x!==el&&x.value!==v)x.value=v})}
function normalize(v){return String(v??'').trim().replace(/％/g,'%').replace(/\s+/g,'').toUpperCase()}
function correctItem(it,given){const a=it.answer.map(normalize),g=(given||[]).map(normalize);if(g.length<a.length)return false;if(it.orderSensitive===false)return [...a].sort().join('|')===[...g].sort().join('|');return a.every((x,i)=>x===g[i])}
function submitExam(){
 const e=STATE.exam,p=getProgress(e.n);let score=0;const details=[],sections={};
 e.items.forEach(it=>{const ok=correctItem(it,p.answers[ansKey(it)]);const pt=ok?SEC_POINTS[it.sec]:0;score+=pt;sections[it.sec]=(sections[it.sec]||0)+pt;details.push({key:ansKey(it),ok,pt,given:p.answers[ansKey(it)]||[],answer:it.answer,exp:it.explanation,topic:it.topic,sec:it.sec,no:it.no})});
 const result={score,details,sections,at:Date.now()};STORE.set(keyResult(e.n),JSON.stringify(result));clearInterval(STATE.timer);STATE.timer=null;closeSheet();renderReview(e,result);showView('review');
}
function renderReview(e,r){
 const max={1:10,2:10,3:10,4:15,5:15,6:15,7:25};const topics={};r.details.forEach(d=>{topics[d.topic]=topics[d.topic]||{ok:0,n:0};topics[d.topic].n++;if(d.ok)topics[d.topic].ok++});
 $('#review').innerHTML=`<div class="card result-hero"><div class="result-score ${r.score>=70?'pass':'fail'}">${r.score}</div><div><div class="kicker">${e.title}</div><h2 style="margin:3px 0">${r.score>=70?'70点を超えた。':'弱点を潰してもう1回。'}</h2><div class="muted">合格ラインの目安を70点として表示。採点は本サイトの独自模試に対するものです。</div><div class="actions"><button class="primary" onclick="startExam(${e.n})">もう一度解く</button><button class="ghost" onclick="renderMocks();showView('mocks')">模試一覧</button></div></div></div>
 <div class="section-title"><h2>大問別</h2></div><div class="breakdown">${[1,2,3,4,5,6,7].map(s=>`<div class="break-item"><span>【${s}】</span><b>${r.sections[s]||0}/${max[s]}</b></div>`).join('')}</div>
 <div class="section-title"><h2>分野別</h2></div><div class="card topic-bars">${Object.entries(topics).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([t,v])=>{const pct=Math.round(v.ok/v.n*100);return `<div class="topic-row"><span>${esc(t)}</span><div class="topic-track"><i style="width:${pct}%"></i></div><span>${v.ok}/${v.n}</span></div>`}).join('')}</div>
 <div class="section-title"><h2>全35採点欄の解説</h2></div>${r.details.map(d=>`<div class="review-item ${d.ok?'ok':'ng'}"><h4>【${d.sec}】${d.no}　${d.ok?'○ 正解':'× 要復習'}　<span class="fine">${SEC_POINTS[d.sec]}点</span></h4><div class="review-answer">あなた：${d.given.length?d.given.map(esc).join(' / '):'未解答'}　｜　正解：<b>${d.answer.map(esc).join(' / ')}</b></div><div class="review-exp">${esc(d.exp)}</div></div>`).join('')}`;
}
function startTimer(){clearInterval(STATE.timer);STATE.timer=setInterval(updateTimer,1000);updateTimer()}
function updateTimer(){if(!STATE.exam)return;const p=getProgress(STATE.exam.n);STATE.remaining=Math.max(0,Math.ceil((p.deadline-Date.now())/1000));const m=Math.floor(STATE.remaining/60),s=STATE.remaining%60,el=$('#timer');if(el){el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;el.classList.toggle('danger',STATE.remaining<=300)}if(STATE.remaining===0&&STATE.timer){clearInterval(STATE.timer);STATE.timer=null;openSheet()}}
function resetExam(n){STORE.del(keyProgress(n));STORE.del(keyResult(n));renderMocks()}

$('#closeSheet').addEventListener('click',closeSheet);$('.drawer__scrim').addEventListener('click',closeSheet);$('#themeBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');STORE.set('zensho-v3-dark',document.body.classList.contains('dark')?'1':'0')});
if(STORE.get('zensho-v3-dark')==='1')document.body.classList.add('dark');
setupNav();renderHome();
</script>
</body>
</html>
