<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全商プログラミング1級 本番形式模試</title><meta name="description" content="全商情報処理検定プログラミング1級の近年形式を分析して作成した非公式オリジナル模擬試験10回。"></head><body><noscript>JavaScriptを有効にしてください。</noscript><script>(async()=>{const names=['v4-0.txt','v4-1.txt','v4-2.txt'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n+' の取得に失敗');return r.text()}));const b=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ab=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();const raw=new Uint8Array(ab);const digest=await crypto.subtle.digest('SHA-256',raw);const hex=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');if(hex!=='a9fd733832e86f4beb34fe983311b539e4769f7a4157081391da15a7bd771718')throw new Error('V3データの整合性検証に失敗');const html=new TextDecoder().decode(raw);document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<main style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;max-width:720px;margin:48px auto;padding:20px"><h1>読み込みに失敗しました</h1><p>ページを再読み込みしてください。</p><pre style="white-space:pre-wrap">'+String(e)+'</pre></main>'})</script></body></html>
